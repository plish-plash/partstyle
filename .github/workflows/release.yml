# Builds the standalone partstyle executables (scripts/standalone.mjs) for each platform and
# the Claude Desktop extension (partstyle.mcpb), smoke-tests them, zips the seed part library,
# and on a v* tag publishes them with checksums as a GitHub release. Run it by hand
# (workflow_dispatch) for a dry run: the same builds and checks, as artifacts only. The version
# comes from packages/*/package.json; a tag must be v plus that version, or nothing is built.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The packages agree on one semantic version and, on a tag, the tag is v<that version>.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node scripts/check-version.mjs "$GITHUB_REF_NAME"
          else
            node scripts/check-version.mjs
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: bun-linux-x64 bun-linux-arm64
            native: linux-x64
          - os: macos-latest # Apple Silicon
            targets: bun-darwin-arm64 bun-darwin-x64
            native: darwin-arm64
          - os: windows-latest
            targets: bun-windows-x64
            native: windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm standalone ${{ matrix.targets }}
      # Apple Silicon refuses to run unsigned code; an ad-hoc signature is enough to run it,
      # though Gatekeeper still warns about a downloaded file (Developer ID signing and
      # notarization would avoid that).
      - name: Sign (ad hoc)
        if: runner.os == 'macOS'
        run: for f in packages/cli/standalone/out/partstyle-darwin-*; do codesign --sign - --force "$f"; done
      - name: Smoke-test the native executable
        shell: bash
        run: |
          export PARTSTYLE_BINARY="$PWD/packages/cli/standalone/out/partstyle-${{ matrix.native }}"
          pnpm vitest run packages/cli/src/standalone.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: partstyle-${{ matrix.os }}
          # Executables only, not the source maps beside them.
          path: |
            packages/cli/standalone/out/partstyle-*
            !packages/cli/standalone/out/*.map
          if-no-files-found: error

  # The Claude Desktop extension: one Node bundle for every platform (Claude Desktop runs it
  # with its own Node.js), checked under Node 22 while packing and again under Node 20, the
  # oldest its manifest accepts.
  mcpb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the extension
        run: pnpm mcpb
      - name: Smoke-test its server
        env:
          PARTSTYLE_BINARY: ${{ github.workspace }}/packages/cli/standalone/out/mcpb/server/index.mjs
        run: pnpm vitest run packages/cli/src/standalone.test.ts
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Check it under Node 20
        run: node scripts/standalone.mjs --check-mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: partstyle-mcpb
          # The notices cover the executables too: they bundle the same packages.
          path: |
            packages/cli/standalone/out/partstyle.mcpb
            packages/cli/standalone/out/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  # The seed part library, with library/ at the top of the zip: unzipped in the projects folder,
  # it is the shared library new projects use.
  library:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: zip -r -X partstyle-library.zip library
      - uses: actions/upload-artifact@v4
        with:
          name: partstyle-library
          path: partstyle-library.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, mcpb, library]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: partstyle-*
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum partstyle* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
