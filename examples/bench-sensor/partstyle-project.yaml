# A Partstyle project: its name, design context and settings. Keep the description to
# a short summary: the design overview is notes/design.md.
partstyle_version: "0.2.0"
name: bench-sensor
description: Bench interface that reads a remote analog sensor and reports over UART
environment:
  temp_c: [0, 50]
  indoor: true
assembly:
  method: SMT service + hand-soldered THT
  volume: 10
external_interfaces:
  - connector: J1
    connects_to: 12 V wall adapter
    signal: 12 V DC
    hazards:
      - reverse polarity
  - connector: J2
    connects_to: remote sensor on 2 m cable
    signal: 0-3.3 V analog, sensor powered from +5V
    hazards:
      - ESD
      - hazard: miswiring to 12 V
        accepted: on a bench tool; it may destroy D3, but R2 keeps it out of U3
  - connector: J5
    connects_to: USB-UART adapter
    signal: 3.3 V UART
    hazards:
      - hazard: ESD
        accepted: bench debug header for a grounded USB-UART adapter; no clamp needed

sourcing:
  distributors: [lcsc, digikey]
