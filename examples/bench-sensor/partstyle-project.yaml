# A Partstyle project: its name, design context and settings. Checks and design review
# read the context; the description is plain paragraphs for people.
partstyle_version: "0.2.0"
name: bench-sensor
description: |
  A bench interface that reads a remote analog sensor and reports over UART.
  The sensor sits on a 2 m cable, so the input is clamped and filtered at the
  connector before a unity-gain buffer drives the MCU's ADC.

use_case: Benchtop sensor interface
environment:
  temp_c: [0, 50]
  indoor: true
power:
  source: 12 V wall adapter
  connector: PWR/J1
assembly:
  method: SMT service + hand-soldered THT
  volume: 10
external_interfaces:
  - connector: AFE/J2
    connects_to: remote sensor on 2 m cable
    signal: 0-3.3 V analog, sensor powered from +5V
    hazards:
      - ESD
      - miswiring to 12 V
  - connector: MCU/J5
    connects_to: USB-UART adapter
    signal: 3.3 V UART
    hazards:
      - ESD

sourcing:
  distributors: [lcsc, digikey]
