ratings:
  iovdd: { min: 1.62V, typ: 3.3V, max: 3.63V, abs_max: 3.63V, abs_min: -0.5V }
  dvdd: { min: 1.05V, typ: 1.1V, max: 1.16V, note: "1.15 V for 200 MHz operation" }
  vreg_vin: { min: 1.62V, max: 3.63V }
  vreg_vout_max_current: 100mA
  usb_vdd: { min: 3.135V, typ: 3.3V, max: 3.63V }
  adc_avdd: { min: 1.62V, typ: 3.3V, max: 3.63V }
  vpin: { min: -0.5V, max: IOVDD + 0.5V }
  fault_tolerant_gpio: "GPIO0-25, SWCLK, SWDIO, RUN draw very little current below
    3.63 V when IOVDD is 0 V (not 5 V tolerant)"
  clock: { max: 133MHz, note: "200 MHz qualified at DVDD 1.15 V" }
  sram: 264KB
  flash_external_max: 16MB
  gpio_drive_ma: [2, 4, 8, 12]
  gpio_default_drive: 4mA
  iovdd_total_source_max: 50mA
  iovss_total_sink_max: 50mA
