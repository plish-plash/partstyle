  pull_down: { min: 50k, max: 80k }
  input_leakage_max: 1uA
  esd_hbm: 2kV (4 kV on FT pins)
  esd_cdm: 500V
temp_c: [-40, 85]
requirements:
  - text: Decouple each IOVDD pin with 100 nF close to the pin (minimal design)
    cap: { from: IOVDD, to: GND, min: 100n, each: true }
  - text: Decouple each DVDD pin with 100 nF
    cap: { from: DVDD, to: GND, min: 100n, each: true }
  - text: 1 uF on VREG_VIN
    cap: { from: VREG_VIN, to: GND, min: 1u }
  - text: 1 uF on VREG_VOUT
    cap: { from: VREG_VOUT, to: GND, min: 1u }
  - text: TESTEN must be tied to GND
    tie: { from: TESTEN, to: GND }
  - USB_DP and USB_DM each need a 27 ohm series resistor; pull-ups are internal
  - Boot code runs from external QSPI flash (up to 16 MB); W25Q-series 3.3 V NOR
    is the reference choice
  - 12 MHz crystal on XIN/XOUT with ~1 k series resistor on XOUT per the
    reference design (ABM8-272-T3 recommended); the USB bootloader requires 12
    MHz
  - Expose a way to pull QSPI_SS low at reset (BOOTSEL button through ~1 k) to
    reach the USB bootloader
notes:
  - GND is only the exposed pad; the ePad is smaller than common QFN-56
    footprints, so the generic KiCad footprint may need its EP adjusted.
  - GPIO26-29 ADC inputs; ADC ENOB 8.7 bits, DNL spikes at codes
    512/1536/2560/3584 (erratum E11).
  - All GPIO reset to pull-down; QSPI_SS resets pulled up.
  - Watchdog decrements twice per tick (E1); USB enumeration on busy hubs needs
    SDK fix on B0/B1 (E5).
  - If IOVDD < 2.5 V set GPIO VOLTAGE_SELECT accordingly.
