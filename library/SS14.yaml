notes:
  - Made by many vendors (onsemi/Fairchild, Vishay SS14-E3, MDD, Slkor, KUU...);
    leakage and surge ratings differ - reverse leakage rises steeply with
    temperature (mA range at 100 C).
  - Typical uses - USB VBUS OR-ing / reverse protection, buck catch diode, relay
    flyback.
  - Equivalent to 1N5819 in SMA; marking SS14 or S4.
