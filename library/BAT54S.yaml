id: BAT54S
summary: Dual series Schottky diode 30 V 200 mA, VF 320 mV at 1 mA, 10 pF, SOT-23
manufacturer: onsemi
preferred_mpn: BAT54SLT1G
package: SOT-23
footprint: Package_TO_SOT_SMD:SOT-23
kicad_symbol: Diode:BAT54S
pins:
  1: { name: A, note: "Anode of diode 1" }
  2: { name: K, note: "Cathode of diode 2" }
  3: { name: COM, note: "Cathode of diode 1 and anode of diode 2 (midpoint)" }
ratings:
  vr: 30V
  v_br_min: 30V (IR 10 uA)
  if: 200mA (DC, per diode)
  ifrm: 300mA
  ifsm: 600mA (t < 1 s)
  pd: 225mW (TA 25 C, derate 1.8 mW/C)
  vf:
    {
      at_0.1mA: "0.22 typ / 0.24 max V",
      at_1mA: "0.29 / 0.32 V",
      at_10mA: "0.35 / 0.40 V",
      at_30mA: "0.41 / 0.50 V",
      at_100mA: "0.52 / 0.80 V",
    }
  ir: { typ: 0.5uA, max: 2uA, at: 25V }
  ct: { typ: 7.6pF, max: 10pF, at: "1 V, 1 MHz" }
  trr_max: 5ns (IF = IR = 10 mA, recover to 1 mA)
  tj: { min: -55C, max: 125C }
temp_c: [-55, 125]
notes:
  - Typical use is a rail-to-rail input clamp - pin 1 to GND, pin 2 to VCC, pin
    3 to the protected signal.
  - Also used as a two-input diode OR or a voltage doubler.
  - Marking LD3 + date code. SBAT54SLT1G is the AEC-Q101 version.
  - Electrical values are per diode at 25 C.
