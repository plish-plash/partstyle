requirements:
  - text: 100 nF per IOVDD pin, close to the pin
    cap: { from: IOVDD, to: GND, min: 100n, each: true }
  - text: DVDD decoupling - 100 nF on the two DVDD pins near the regulator (6, 39),
      4.7 uF on the far one (23)
    cap: { from: DVDD, to: GND, min: 100n, each: true }
  - text: 4.7 uF between VREG_VIN and ground close to the pin, with its own GND via
      to the pad
    cap: { from: VREG_VIN, to: GND, min: 4.7u }
  - text: VREG_AVDD fed through 33 ohm with 4.7 uF to GND (RC filter)
    cap: { from: VREG_AVDD, to: GND, min: 4.7u }
  - text: 100 nF on USB_OTP_VDD
    cap: { from: USB_OTP_VDD, to: GND, min: 100n }
  - text: 100 nF on ADC_AVDD
    cap: { from: ADC_AVDD, to: GND, min: 100n }
  - text: 100 nF on QSPI_IOVDD (Minimal design shares one cap between pins 53 and 54)
    cap: { from: QSPI_IOVDD, to: GND, min: 100n }
  - 3.3 uH inductor VREG_LX -> 1.1 V (Abracon AOTA-B201610S3R3-101-T,
    polarity-marked, orientation matters), 4.7 uF output cap, VREG_FB to the 1.1
    V node; copy the Pico 2 / Minimal layout exactly, all regulator parts on the
    same side
  - USB_DP/USB_DM need 27 ohm series resistors near the chip
  - 12 MHz ABM8-272-T3 crystal, 15 pF load caps, 1 k series on XOUT (tuned for
    IOVDD 3.3 V; re-tune at other IOVDD)
  - QSPI flash on QSPI pins (W25Q128JVS reference); flash must support 03h read
    with 24-bit address, 02h/05h/06h/20h
  - Provide BOOTSEL (QSPI_SS to GND via 1 k) and optionally a RUN reset button
notes:
  - Not pin-compatible with RP2040 despite the same 7x7 body.
  - GPIO0-25 are fault tolerant - up to 5.5 V when IOVDD is 3.3 V and powered;
    ADC pins GPIO26-29 are not.
  - If IOVDD or QSPI_IOVDD is 1.8 V, set VOLTAGE_SELECT=1; running above 1.8 V
    with VOLTAGE_SELECT=1 can damage the chip.
  - Power sequencing - only VREG_VIN and VREG_AVDD must come up together; DVDD
    before or with ADC_AVDD avoids small transient currents.
  - The regulator output can be software-set up to 3.3 V, above the DVDD limit;
    keep the voltage limit enabled.
  - Erratum RP2350-E9 (A2 stepping) - a Bank 0 input in the undefined region
    leaks ~120 uA and sits near 2.2 V; internal pull-down can't hold it low (use
    8.2k or lower external pull-down). Fixed in stepping A3.
  - RP2354A is the same package with 2 MB stacked flash (QSPI_IOVDD must then be
    3.3 V).
  - The datasheet's power-pin table lists IOVDD as 11, 20, 30, 38, 45, 54 for
    QFN-60, omitting pin 1 and repeating 54 (QSPI_IOVDD); the pinout figure,
    product brief and KiCad symbol all show pin 1 as IOVDD, which this record
    follows.
