notes:
  - Complement of 2N7002 for small-signal high-side switching and level shifting.
  - Only rated at -5 V gate drive; at 3.3 V drive RDS(on) is high and
    uncharacterised. Use AO3401A for real load switching.
  - Switching typ - td(on) 2.5 ns, tr 6.3 ns, td(off) 10 ns, tf 4.8 ns (VDD -30
    V, -0.27 A).
  - Nexperia, Diodes Inc and others make BSS84 with different ratings.
