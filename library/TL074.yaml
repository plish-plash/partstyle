requirements:
  - text: 100 nF decoupling on V+ to ground
    cap: { from: V+, to: GND, min: 100n }
  - Decouple V- to ground with 100 nF too when using split supplies
  - Tie unused amplifiers as followers with the + input inside the common-mode
    range
notes:
  - JFET input - common-mode range does not reach the negative rail, so it is a
    poor choice for single-supply circuits near ground (use LM358 there);
    driving inputs near V- can cause phase reversal.
  - Classic audio and synth workhorse on +/-12 V or +/-15 V.
  - C suffix (this part) is rated 0..70 C; TL074IDT is the -40..105 C grade.
    TI's TL074 is pin-compatible (TI's newer TL074H runs from 4.5-40 V with
    improved specs).
  - Values are from the ST datasheet; ST's features list quotes 16 V/us slew
    while its table gives 13 V/us typ.
