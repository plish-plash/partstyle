  verified_by: human
timing:
  page_program: { typ: 0.4ms, max: 3ms }
  sector_erase_4k: { typ: 45ms, max: 400ms }
  block_erase_32k: { typ: 120ms, max: 1600ms }
  block_erase_64k: { typ: 150ms, max: 2000ms }
  chip_erase: { typ: 40s, max: 200s }
  write_status_register: { typ: 10ms, max: 15ms }
  t_vsl_min: 20us (VCC min to /CS low)
  t_puw_min: 5ms (before write instruction)
  t_clqv_max: 6ns (clock low to output valid)
  t_slch_min: 3ns (/CS setup)
  t_dvch_min: 1ns (data setup)
  t_chdx_min: 2ns (data hold)
  t_shsl_min: "10 ns read, 50 ns erase/program/write (/CS deselect)"
  t_dp_max: 3us (to power-down)
  t_res1_max: 3us (release power-down)
  t_sus_max: 20us (after suspend)
  t_rst_max: 30us (after software reset)
organization: 65,536 pages of 256 B; 4,096 sectors of 4 KB; 256 blocks of 64 KB
