ratings:
  voltage: 48V DC
  current: { vbus_total: 5A, gnd_total: 6.25A, b5: 1.25A, other_pins: 0.25A each }
  contact_resistance: 40mohm max initial (50 mohm after test)
  insulation_resistance: 100Mohm min
  dielectric_withstand: 100V AC, 1 min
  durability: 20000 cycles
  mating_force: 5-20 N
temp_c: [-40, 85]
requirements:
  - CC1 and CC2 each need their own 5.1k pull-down to GND for a sink to get 5 V
    from a USB-C source; a single shared resistor breaks with e-marked cables
  - Join A6/B6 (D+) and A7/B7 (D-) on the board so either plug orientation works
notes:
  - USB 2.0 only - no SuperSpeed pairs; SBU pins usually left open.
  - The footprint's VBUS and GND pads are paired (A1/B12, A4/B9, A9/B4, A12/B1
    share pads), so they are connected by the land pattern.
  - 3.31 mm profile; contacts gold flash over nickel (15/30 uin gold options);
    stainless shell; LCP housing UL94V-0. Reflow peak 255 C, 5 s max.
  - Add USBLC6-2SC6 near the connector for ESD.
