temp_c: [-65, 150]
requirements:
  - Gate is unprotected - treat as ESD sensitive; a series gate resistor and
    gate-source pull-down (100k) are customary
notes:
  - RDS(on) is specified at 5 V gate drive (50 mA) but not at 3.3 V; at 3.3 V
    logic it only switches light loads (LEDs, level shifting). For heavier loads
    from 3.3 V use AO3400A.
  - Classic bidirectional I2C/UART level shifter (gate to low-side rail, source
    to low side, drain to high side, pull-ups both sides).
  - Same family datasheet covers 2N7000 (TO-92) and NDS7002A (280 mA, 2 ohm);
    other vendors' 2N7002 parts differ (Nexperia 300 mA / 5 ohm).
  - Complement is BSS84.
