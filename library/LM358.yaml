id: LM358
summary: Dual general-purpose op amp, 3-32 V single supply, inputs include
  ground, 0.7 MHz GBW, 0.3 V/us, SOIC-8
manufacturer: Texas Instruments
preferred_mpn: LM358DR
package: SOIC-8 3.9 mm
footprint: Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
kicad_symbol: Amplifier_Operational:LM358
pins:
  1: { name: 1OUT, type: output }
  2:
    {
      name: 1IN-,
      type: input,
      unused: required,
      note: "Unused section - wire as a follower with + input at mid-rail or ground",
    }
  3: { name: 1IN+, type: input, unused: required }
  4: { name: GND, type: power_in, note: "V- (GND for single supply)" }
  5: { name: 2IN+, type: input, unused: required }
